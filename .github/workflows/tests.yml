name: Tests and Build

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  unit-tests:
    name: Unit Tests
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v7

    - name: Set up Go
      uses: actions/setup-go@v7
      with:
        go-version-file: src/bosh-libvirt-cpi/go.mod
        cache-dependency-path: src/bosh-libvirt-cpi/go.sum

    - name: Install libvirt dev headers
      run: sudo apt-get update && sudo apt-get install -y libvirt-dev

    - name: Verify vendor directory
      working-directory: src/bosh-libvirt-cpi
      run: |
        if [ ! -d "vendor" ]; then
          echo "Vendor directory not found. Running go mod vendor..."
          go mod vendor
        fi

    - name: Run unit tests
      working-directory: src/bosh-libvirt-cpi
      run: make test

    - name: Upload coverage reports
      uses: codecov/codecov-action@v7
      with:
        files: src/bosh-libvirt-cpi/coverage.out
        flags: unittests

  build:
    name: Build Binary
    runs-on: ubuntu-latest
    needs: unit-tests

    steps:
    - uses: actions/checkout@v7

    - name: Set up Go
      uses: actions/setup-go@v7
      with:
        go-version-file: src/bosh-libvirt-cpi/go.mod
        cache-dependency-path: src/bosh-libvirt-cpi/go.sum

    - name: Install libvirt dev headers
      run: sudo apt-get update && sudo apt-get install -y libvirt-dev

    - name: Build binary
      working-directory: src/bosh-libvirt-cpi
      run: make build

    - name: Upload binary
      uses: actions/upload-artifact@v7
      with:
        name: cpi-binary
        path: src/bosh-libvirt-cpi/bin/cpi

  integration-tests-qemu:
    name: Integration Tests (QEMU)
    runs-on: ubuntu-latest
    needs: build

    steps:
    - uses: actions/checkout@v7

    - name: Set up Go
      uses: actions/setup-go@v7
      with:
        go-version-file: src/bosh-libvirt-cpi/go.mod
        cache-dependency-path: src/bosh-libvirt-cpi/go.sum

    - name: Install QEMU + libvirt
      run: |
        sudo apt-get update
        sudo apt-get install -y qemu-kvm libvirt-daemon-system libvirt-clients virtinst libvirt-dev
        sudo systemctl start libvirtd
        sudo usermod -aG libvirt $USER

    - name: Verify vendor directory
      working-directory: src/bosh-libvirt-cpi
      run: |
        if [ ! -d "vendor" ]; then
          echo "Vendor directory not found. Running go mod vendor..."
          go mod vendor
        fi

    - name: Run integration tests (QEMU)
      working-directory: src/bosh-libvirt-cpi
      env:
        LIBVIRT_URI: qemu:///system
      run: sudo -E go test -tags integration -mod=vendor ./...

    - name: Generate coverage
      working-directory: src/bosh-libvirt-cpi
      run: sudo -E go test -coverprofile=coverage.out -mod=vendor ./...

    - name: Upload coverage
      uses: codecov/codecov-action@v7
      with:
        files: src/bosh-libvirt-cpi/coverage.out
        flags: integration-qemu

  e2e-qemu:
    name: E2E bosh-lite (QEMU)
    runs-on: ubuntu-latest
    needs: build

    steps:
    - name: Free disk space
      run: |
        sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc /usr/local/.ghcup \
          /usr/lib/jvm /usr/share/swift /usr/local/share/chromium /usr/local/share/powershell \
          /opt/hostedtoolcache/CodeQL /opt/hostedtoolcache/Ruby /opt/hostedtoolcache/PyPy \
          /usr/local/share/vcpkg /opt/microsoft || true
        sudo apt-get clean
        df -h /

    - uses: actions/checkout@v7

    - name: Set up Go
      uses: actions/setup-go@v7
      with:
        go-version-file: src/bosh-libvirt-cpi/go.mod
        cache-dependency-path: src/bosh-libvirt-cpi/go.sum

    - name: Install QEMU + libvirt
      run: |
        sudo apt-get update
        sudo apt-get install -y qemu-kvm libvirt-daemon-system libvirt-clients virtinst libvirt-dev linux-image-generic e2fsprogs
        sudo systemctl start libvirtd
        sudo usermod -aG libvirt $USER
        sudo virsh net-start default || true
        sudo virsh net-autostart default || true

    - name: Install BOSH CLI
      run: |
        curl -fsSL https://github.com/cloudfoundry/bosh-cli/releases/download/v7.10.8/bosh-cli-7.10.8-linux-amd64 \
          -o /usr/local/bin/bosh
        chmod +x /usr/local/bin/bosh
        bosh --version

    - name: Patch golang-1-linux packaging with actual GOROOT
      run: |
        GO_VERSION=$(go env GOVERSION | sed 's/go//')
        GOROOT_PATH=$(go env GOROOT)
        # Install Go to BOSH_INSTALL_TARGET (/var/vcap/packages/golang-1-linux, persistent disk).
        # /usr/local is on the small root ext4 inside the QEMU VM; installing 600MB of Go there
        # fills it up, causing all subsequent package compilations to fail with ENOSPC.
        printf '#!/bin/bash\nset -e -x\nmkdir -p "${BOSH_INSTALL_TARGET}/bosh" "${BOSH_INSTALL_TARGET}/go"\n' > packages/golang-1-linux/packaging
        printf 'if [ ! -f "${BOSH_INSTALL_TARGET}/go/bin/go" ]; then\n' >> packages/golang-1-linux/packaging
        printf '  curl -fsSL "https://dl.google.com/go/go'"${GO_VERSION}"'.linux-amd64.tar.gz" -o /tmp/golang.tar.gz\n' >> packages/golang-1-linux/packaging
        printf '  tar -C "${BOSH_INSTALL_TARGET}" -xzf /tmp/golang.tar.gz\n  rm -f /tmp/golang.tar.gz\nfi\n' >> packages/golang-1-linux/packaging
        printf 'printf "export GOROOT=${BOSH_INSTALL_TARGET}/go\\nexport GOPATH=\$PWD\\nexport GOCACHE=/tmp/go-cache\\nexport GOTOOLCHAIN=local\\nexport PATH=${BOSH_INSTALL_TARGET}/go/bin:\$GOPATH/bin:\$PATH\\n" > "${BOSH_INSTALL_TARGET}/bosh/compile.env"\n' >> packages/golang-1-linux/packaging
        printf 'printf "export GOROOT=${BOSH_INSTALL_TARGET}/go\\nexport GOCACHE=/tmp/go-cache\\nexport GOPATH=\$PWD\\nexport PATH=${BOSH_INSTALL_TARGET}/go/bin:\$GOPATH/bin:\$PATH\\n" > "${BOSH_INSTALL_TARGET}/bosh/runtime.env"\n' >> packages/golang-1-linux/packaging
        chmod +x packages/golang-1-linux/packaging
        printf -- '---\nname: golang-1-linux\n\nfiles: []\n' > packages/golang-1-linux/spec

    - name: Build CPI release tarball
      run: bosh create-release --force --tarball /tmp/bosh-libvirt-cpi.tgz

    - name: Download BOSH stemcell
      run: |
        curl -fsSL https://bosh.io/d/stemcells/bosh-warden-boshlite-ubuntu-jammy-go_agent \
          -o /tmp/bosh-stemcell.tgz

    - name: Prepare host kernel for direct boot
      run: |
        KERNEL=$(ls /boot/vmlinuz-* | sort -V | tail -1)
        echo "Using kernel: $KERNEL"
        sudo cp "$KERNEL" /tmp/vmlinuz
        sudo chmod 644 /tmp/vmlinuz
        echo "KERNEL_PATH=/tmp/vmlinuz" >> $GITHUB_ENV

    - name: Configure DHCP reservation for Director VM
      run: |
        sudo virsh net-update default add ip-dhcp-host \
          "<host mac='52:54:00:ab:cd:10' ip='192.168.122.10'/>" \
          --live --config || true

    - name: Bootstrap BOSH Director via QEMU (bosh-lite, direct kernel boot)
      run: |
        sudo mkdir -p /tmp/bosh_libvirt_cpi/{stemcells,vms,disks}
        sudo chmod -R 755 /tmp/bosh_libvirt_cpi
        sudo chown -R root:root /tmp/bosh_libvirt_cpi
        sudo bosh create-env manifests/qemu-cpi.yml \
          -o manifests/ops/qemu-local.yml \
          -o manifests/local-release.yml \
          -o manifests/ops/local-store-dir.yml \
          -o manifests/ops/qemu-mac.yml \
          -o manifests/ops/qemu-kernel-boot.yml \
          -v director_name=bosh-qemu-ci \
          -v internal_ip=192.168.122.10 \
          -v stemcell_url=file:///tmp/bosh-stemcell.tgz \
          -v kernel_path="${KERNEL_PATH}" \
          --state /tmp/bosh-state.json \
          --vars-store /tmp/bosh-vars.yml || {
            echo "=== QEMU VM console (agent output) ===" && \
              sudo find /tmp -name 'bosh-vm-*-console.log' 2>/dev/null | xargs sudo cat 2>/dev/null | grep -v '^\[' | grep -E 'ERROR|App|main|mbus|cert|monit|sv|bosh-agent|agent|FAIL|error' | tail -50 || true
            echo "=== QEMU VM console (last 50 lines) ===" && \
              sudo find /tmp -name 'bosh-vm-*-console.log' 2>/dev/null | xargs sudo cat 2>/dev/null | tail -50 || true
            echo "=== QEMU VM disk usage (df /var/vcap/data) ===" && \
              sudo find /tmp -name 'bosh-vm-*-console.log' 2>/dev/null | xargs sudo cat 2>/dev/null | grep -E 'df |Filesystem|/dev/|vcap/data' | tail -10 || true
            echo "=== DHCP log ===" && \
              sudo find /tmp/bosh_libvirt_cpi -name dhclient.log 2>/dev/null | xargs sudo cat 2>/dev/null | tail -20 || true
            echo "=== DHCP leases ===" && sudo virsh net-dhcp-leases default 2>/dev/null || true
            exit 1
          }

    - name: Deploy smoke test deployment (QEMU)
      run: |
        bosh alias-env qemu-ci \
          -e "192.168.122.10" \
          --ca-cert <(bosh int /tmp/bosh-vars.yml --path /director_ssl/ca)
        bosh -e qemu-ci -d qemu-test-deployment deploy manifests/qemu-deployment.yml \
          -n --fix

    - name: Clean up Director (QEMU)
      if: always()
      run: |
        sudo bosh delete-env manifests/qemu-cpi.yml \
          -o manifests/ops/qemu-local.yml \
          -o manifests/local-release.yml \
          -o manifests/ops/local-store-dir.yml \
          -o manifests/ops/qemu-mac.yml \
          -o manifests/ops/qemu-kernel-boot.yml \
          --state /tmp/bosh-state.json \
          --vars-store /tmp/bosh-vars.yml \
          -v director_name=bosh-qemu-ci \
          -v internal_ip=192.168.122.10 \
          -v stemcell_url=file:///tmp/bosh-stemcell.tgz \
          -v kernel_path="${KERNEL_PATH}" || true

  integration-tests-lxc:
    name: Integration Tests (LXC)
    runs-on: ubuntu-latest
    needs: build

    steps:
    - uses: actions/checkout@v7

    - name: Set up Go
      uses: actions/setup-go@v7
      with:
        go-version-file: src/bosh-libvirt-cpi/go.mod
        cache-dependency-path: src/bosh-libvirt-cpi/go.sum

    - name: Install LXC + libvirt
      run: |
        sudo apt-get update
        sudo apt-get install -y lxc libvirt-daemon-system libvirt-daemon-driver-lxc libvirt-dev
        sudo systemctl start libvirtd
        sudo usermod -aG libvirt $USER

    - name: Verify vendor directory
      working-directory: src/bosh-libvirt-cpi
      run: |
        if [ ! -d "vendor" ]; then
          echo "Vendor directory not found. Running go mod vendor..."
          go mod vendor
        fi

    - name: Run integration tests (LXC)
      working-directory: src/bosh-libvirt-cpi
      env:
        LIBVIRT_URI: lxc:///
      run: sudo -E go test -tags integration -mod=vendor ./...

  e2e-lxc:
    name: E2E bosh-lite (LXC)
    runs-on: ubuntu-latest
    needs: build

    steps:
    - name: Free disk space
      run: |
        sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc /usr/local/.ghcup \
          /usr/lib/jvm /usr/share/swift /usr/local/share/chromium /usr/local/share/powershell \
          /opt/hostedtoolcache/CodeQL /opt/hostedtoolcache/Ruby /opt/hostedtoolcache/PyPy \
          /usr/local/share/vcpkg /opt/microsoft || true
        sudo apt-get clean
        df -h /

    - uses: actions/checkout@v7

    - name: Set up Go
      uses: actions/setup-go@v7
      with:
        go-version-file: src/bosh-libvirt-cpi/go.mod
        cache-dependency-path: src/bosh-libvirt-cpi/go.sum

    - name: Install LXC + libvirt
      run: |
        sudo apt-get update
        sudo apt-get install -y lxc libvirt-daemon-system libvirt-daemon-driver-lxc libvirt-dev systemd-container
        # Enable user namespaces required by libvirt-lxc on GitHub Actions runners
        sudo sysctl -w kernel.unprivileged_userns_clone=1 2>/dev/null || true
        sudo sysctl -w user.max_user_namespaces=15000 2>/dev/null || true
        # Mask libvirtd sockets so systemd does not stop libvirtd when CPI clients disconnect.
        sudo systemctl mask libvirtd.socket libvirtd-ro.socket libvirtd-admin.socket 2>/dev/null || true
        # Disable libvirtd idle shutdown. libvirtd has a default shutdown_timeout of 120s:
        # it exits cleanly 120s after all clients disconnect, tearing down LXC veth interfaces.
        # Append with high priority so it overrides any existing value in the file.
        printf '\nshutdown_timeout = 0\n' | sudo tee -a /etc/libvirt/libvirtd.conf > /dev/null
        sudo systemctl start libvirtd
        # Keep a persistent libvirt connection open so libvirtd never becomes idle.
        sudo virsh -c lxc:/// list --all &>/dev/null &
        sudo nohup sh -c 'while true; do virsh -c lxc:/// list --all &>/dev/null; sleep 30; done' &>/dev/null &
        sudo usermod -aG libvirt $USER
        sudo virsh net-start default || true
        sudo virsh net-autostart default || true

    - name: Install BOSH CLI
      run: |
        curl -fsSL https://github.com/cloudfoundry/bosh-cli/releases/download/v7.10.8/bosh-cli-7.10.8-linux-amd64 \
          -o /usr/local/bin/bosh
        chmod +x /usr/local/bin/bosh
        bosh --version

    - name: Patch golang-1-linux packaging with actual GOROOT
      run: |
        GO_VERSION=$(go env GOVERSION | sed 's/go//')
        GOROOT_PATH=$(go env GOROOT)
        # Install Go to BOSH_INSTALL_TARGET (/var/vcap/packages/golang-1-linux, persistent disk).
        # /usr/local is on the small root ext4 inside the QEMU VM; installing 600MB of Go there
        # fills it up, causing all subsequent package compilations to fail with ENOSPC.
        printf '#!/bin/bash\nset -e -x\nmkdir -p "${BOSH_INSTALL_TARGET}/bosh" "${BOSH_INSTALL_TARGET}/go"\n' > packages/golang-1-linux/packaging
        printf 'if [ ! -f "${BOSH_INSTALL_TARGET}/go/bin/go" ]; then\n' >> packages/golang-1-linux/packaging
        printf '  curl -fsSL "https://dl.google.com/go/go'"${GO_VERSION}"'.linux-amd64.tar.gz" -o /tmp/golang.tar.gz\n' >> packages/golang-1-linux/packaging
        printf '  tar -C "${BOSH_INSTALL_TARGET}" -xzf /tmp/golang.tar.gz\n  rm -f /tmp/golang.tar.gz\nfi\n' >> packages/golang-1-linux/packaging
        printf 'printf "export GOROOT=${BOSH_INSTALL_TARGET}/go\\nexport GOPATH=\$PWD\\nexport GOCACHE=/tmp/go-cache\\nexport GOTOOLCHAIN=local\\nexport PATH=${BOSH_INSTALL_TARGET}/go/bin:\$GOPATH/bin:\$PATH\\n" > "${BOSH_INSTALL_TARGET}/bosh/compile.env"\n' >> packages/golang-1-linux/packaging
        printf 'printf "export GOROOT=${BOSH_INSTALL_TARGET}/go\\nexport GOCACHE=/tmp/go-cache\\nexport GOPATH=\$PWD\\nexport PATH=${BOSH_INSTALL_TARGET}/go/bin:\$GOPATH/bin:\$PATH\\n" > "${BOSH_INSTALL_TARGET}/bosh/runtime.env"\n' >> packages/golang-1-linux/packaging
        chmod +x packages/golang-1-linux/packaging
        printf -- '---\nname: golang-1-linux\n\nfiles: []\n' > packages/golang-1-linux/spec

    - name: Build CPI release tarball
      run: bosh create-release --force --tarball /tmp/bosh-libvirt-cpi.tgz

    - name: Download BOSH stemcell
      run: |
        curl -fsSL https://bosh.io/d/stemcells/bosh-warden-boshlite-ubuntu-jammy-go_agent \
          -o /tmp/bosh-stemcell.tgz

    - name: Configure DHCP reservation for LXC Director VM
      run: |
        sudo virsh net-update default add ip-dhcp-host \
          "<host mac='52:54:00:ab:cd:11' ip='192.168.122.11'/>" \
          --live --config || true
        # Add a static ARP entry so the host bridge can reach the container's
        # static IP immediately, without waiting for an ARP reply from inside.
        sudo arp -s 192.168.122.11 52:54:00:ab:cd:11 2>/dev/null || true

    - name: Bootstrap BOSH Director via LXC (bosh-lite)
      run: |
        sudo mkdir -p /tmp/bosh_libvirt_cpi/{stemcells,vms,disks}
        sudo chmod -R 755 /tmp/bosh_libvirt_cpi
        sudo chown -R root:root /tmp/bosh_libvirt_cpi
        sudo bosh create-env manifests/lxc-cpi.yml \
          -o manifests/ops/lxc-local.yml \
          -o manifests/local-release.yml \
          -o manifests/ops/local-store-dir.yml \
          -o manifests/ops/lxc-mac.yml \
          -v director_name=bosh-lxc-ci \
          -v internal_ip=192.168.122.11 \
          -v stemcell_url=file:///tmp/bosh-stemcell.tgz \
          --state /tmp/bosh-state.json \
          --vars-store /tmp/bosh-vars.yml || {
            echo "=== libvirtd journal ===" && sudo journalctl -u libvirtd --no-pager | tail -30 || true
            echo "=== virsh list --all ===" && sudo virsh -c lxc:/// list --all 2>/dev/null || true
            VMDIR=$(sudo find /tmp/bosh_libvirt_cpi/vms -maxdepth 1 -type d | tail -1)
            if [ -n "$VMDIR" ]; then
              echo "=== bosh-agent-init.log (first 40 lines) ===" && sudo cat "$VMDIR/rootfs/var/vcap/bosh/log/bosh-agent-init.log" 2>/dev/null | head -40 || true
              echo "=== bosh-agent-init.log (last 80 lines) ===" && sudo cat "$VMDIR/rootfs/var/vcap/bosh/log/bosh-agent-init.log" 2>/dev/null | tail -80 || true
              echo "=== postgres pre-start log ===" && sudo cat "$VMDIR/rootfs/var/vcap/sys/log/postgres/pre-start.stderr.log" 2>/dev/null | tail -30 || true
              echo "=== postgres pre-start stdout ===" && sudo cat "$VMDIR/rootfs/var/vcap/sys/log/postgres/pre-start.stdout.log" 2>/dev/null | tail -30 || true
              echo "=== postgres job logs ===" && sudo find "$VMDIR/rootfs/var/vcap/sys/log/postgres/" -name "*.log" 2>/dev/null | xargs sudo cat 2>/dev/null | tail -40 || true
              echo "=== bosh agent log postgres ===" && sudo cat "$VMDIR/rootfs/var/vcap/bosh/log/current" 2>/dev/null | grep -i "postgres\|pre-start\|Error\|exit" | tail -20 || true
              echo "=== VM rootfs bosh dir ===" && sudo ls -la "$VMDIR/rootfs/var/vcap/bosh/" 2>/dev/null || true
              echo "=== warden-cpi-agent-env.json ===" && sudo cat "$VMDIR/rootfs/var/vcap/bosh/warden-cpi-agent-env.json" 2>/dev/null || true
              echo "=== bosh-lxc-init ===" && sudo cat "$VMDIR/rootfs/bosh-lxc-init" 2>/dev/null || true
              echo "=== DHCP leases ===" && sudo virsh net-dhcp-leases default 2>/dev/null || true
            fi
            exit 1
          }

    - name: Deploy smoke test deployment (LXC)
      run: |
        bosh alias-env lxc-ci \
          -e "192.168.122.11" \
          --ca-cert <(bosh int /tmp/bosh-vars.yml --path /director_ssl/ca)
        bosh -e lxc-ci -d lxc-test-deployment deploy manifests/lxc-deployment.yml \
          -n --fix

    - name: Clean up Director (LXC)
      if: always()
      run: |
        sudo bosh delete-env manifests/lxc-cpi.yml \
          -o manifests/ops/lxc-local.yml \
          -o manifests/local-release.yml \
          -o manifests/ops/local-store-dir.yml \
          -o manifests/ops/lxc-mac.yml \
          --state /tmp/bosh-state.json \
          --vars-store /tmp/bosh-vars.yml \
          -v director_name=bosh-lxc-ci \
          -v internal_ip=192.168.122.11 \
          -v stemcell_url=file:///tmp/bosh-stemcell.tgz || true

  code-quality:
    name: Code Quality
    runs-on: ubuntu-latest
    needs: unit-tests

    steps:
    - uses: actions/checkout@v7

    - name: Set up Go
      uses: actions/setup-go@v7
      with:
        go-version-file: src/bosh-libvirt-cpi/go.mod
        cache-dependency-path: src/bosh-libvirt-cpi/go.sum

    - name: Install libvirt dev headers
      run: sudo apt-get update && sudo apt-get install -y libvirt-dev

    - name: Run vet
      working-directory: src/bosh-libvirt-cpi
      run: go vet -mod=vendor ./...

    - name: Check format
      working-directory: src/bosh-libvirt-cpi
      run: |
        files=$(gofmt -l $(find . -name '*.go' -not -path './vendor/*'))
        if [ -n "$files" ]; then
          echo "Code formatting issues found:"
          echo "$files"
          exit 1
        fi

    - name: Run golangci-lint
      uses: golangci/golangci-lint-action@v9
      with:
        working-directory: src/bosh-libvirt-cpi
        version: latest
        args: --timeout=5m

  security-scan:
    name: Security Scan
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v7

    - name: Install libvirt dev headers
      run: sudo apt-get update && sudo apt-get install -y libvirt-dev

    - name: Run Gosec Security Scanner
      uses: securego/gosec@master
      with:
        args: '-no-fail -fmt sarif -out gosec-results.sarif ./src/bosh-libvirt-cpi/...'

    - name: Upload Gosec results
      uses: github/codeql-action/upload-sarif@v4
      if: always()
      with:
        sarif_file: gosec-results.sarif
