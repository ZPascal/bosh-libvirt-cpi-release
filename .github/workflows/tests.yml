name: Tests and Build

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  unit-tests:
    name: Unit Tests
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v7

    - name: Set up Go
      uses: actions/setup-go@v7
      with:
        go-version-file: src/bosh-libvirt-cpi/go.mod
        cache-dependency-path: src/bosh-libvirt-cpi/go.sum

    - name: Install libvirt dev headers
      run: sudo apt-get update && sudo apt-get install -y libvirt-dev

    - name: Verify vendor directory
      working-directory: src/bosh-libvirt-cpi
      run: |
        if [ ! -d "vendor" ]; then
          echo "Vendor directory not found. Running go mod vendor..."
          go mod vendor
        fi

    - name: Run unit tests
      working-directory: src/bosh-libvirt-cpi
      run: make test

    - name: Upload coverage reports
      uses: codecov/codecov-action@v7
      with:
        files: src/bosh-libvirt-cpi/coverage.out
        flags: unittests

  build:
    name: Build Binary
    runs-on: ubuntu-latest
    needs: unit-tests

    steps:
    - uses: actions/checkout@v7

    - name: Set up Go
      uses: actions/setup-go@v7
      with:
        go-version-file: src/bosh-libvirt-cpi/go.mod
        cache-dependency-path: src/bosh-libvirt-cpi/go.sum

    - name: Install libvirt dev headers
      run: sudo apt-get update && sudo apt-get install -y libvirt-dev

    - name: Build binary
      working-directory: src/bosh-libvirt-cpi
      run: make build

    - name: Upload binary
      uses: actions/upload-artifact@v7
      with:
        name: cpi-binary
        path: src/bosh-libvirt-cpi/bin/cpi

  aarch64-tcg-boot:
    name: aarch64 guest boot (QEMU TCG)
    runs-on: ubuntu-latest
    needs: build
    timeout-minutes: 45

    steps:
    - uses: actions/checkout@v7

    - name: Set up Go
      uses: actions/setup-go@v7
      with:
        go-version-file: src/bosh-libvirt-cpi/go.mod
        cache-dependency-path: src/bosh-libvirt-cpi/go.sum

    - name: Install QEMU (aarch64) + libvirt
      run: |
        sudo apt-get update
        sudo apt-get install -y qemu-system-arm qemu-utils libvirt-daemon-system libvirt-clients libvirt-dev e2fsprogs
        sudo systemctl start libvirtd
        sudo virsh net-start default || true

    - name: Build aarch64 fixture (Ubuntu arm64 kernel + ubuntu-base rootfs)
      run: bash .github/scripts/aarch64-boot-fixture.sh /tmp/aarch64

    - name: Boot aarch64 guest and hot-plug a disk
      working-directory: src/bosh-libvirt-cpi
      env:
        LIBVIRT_URI: qemu:///system
        AARCH64_DIR: /tmp/aarch64
      run: |
        # Pass the test's inputs explicitly: sudo-rs (Ubuntu 26.04) ignores -E.
        sudo env LIBVIRT_URI="${LIBVIRT_URI}" AARCH64_DIR="${AARCH64_DIR}" \
          "$(which go)" test -tags integration_aarch64 -mod=vendor ./driver/ \
          -timeout 40m -v -ginkgo.v -ginkgo.focus 'aarch64 guest boot'

    - name: Guest console log
      if: always()
      run: sudo cat /tmp/bosh-vm-bosh-aarch64-boot-test-console.log 2>/dev/null | tail -100 || true

  integration-tests-qemu:
    name: Integration Tests (QEMU)
    runs-on: ubuntu-latest
    needs: build

    steps:
    - uses: actions/checkout@v7

    - name: Set up Go
      uses: actions/setup-go@v7
      with:
        go-version-file: src/bosh-libvirt-cpi/go.mod
        cache-dependency-path: src/bosh-libvirt-cpi/go.sum

    - name: Install QEMU + libvirt
      run: |
        sudo apt-get update
        sudo apt-get install -y qemu-system-x86 qemu-utils libvirt-daemon-system libvirt-clients virtinst libvirt-dev
        sudo systemctl start libvirtd
        sudo usermod -aG libvirt $USER

    - name: Verify vendor directory
      working-directory: src/bosh-libvirt-cpi
      run: |
        if [ ! -d "vendor" ]; then
          echo "Vendor directory not found. Running go mod vendor..."
          go mod vendor
        fi

    - name: Run integration tests (QEMU)
      working-directory: src/bosh-libvirt-cpi
      env:
        LIBVIRT_URI: qemu:///system
      # sudo-rs (Ubuntu 26.04) ignores -E: pass LIBVIRT_URI explicitly, and
      # REQUIRE_LIBVIRT so a missing/unreachable libvirt fails instead of skipping.
      run: sudo env LIBVIRT_URI="${LIBVIRT_URI}" REQUIRE_LIBVIRT=1 "$(which go)" test -tags integration -mod=vendor ./...

    - name: Generate coverage
      working-directory: src/bosh-libvirt-cpi
      run: sudo "$(which go)" test -coverprofile=coverage.out -mod=vendor ./...

    - name: Upload coverage
      uses: codecov/codecov-action@v7
      with:
        files: src/bosh-libvirt-cpi/coverage.out
        flags: integration-qemu

  e2e:
    name: E2E bosh-lite (${{ matrix.backend }})
    needs: build
    strategy:
      fail-fast: false
      matrix:
        backend: [qemu, lxc]
    uses: ./.github/workflows/e2e.yml
    with:
      backend: ${{ matrix.backend }}

  integration-tests-lxc:
    name: Integration Tests (LXC)
    runs-on: ubuntu-latest
    needs: build

    steps:
    - uses: actions/checkout@v7

    - name: Set up Go
      uses: actions/setup-go@v7
      with:
        go-version-file: src/bosh-libvirt-cpi/go.mod
        cache-dependency-path: src/bosh-libvirt-cpi/go.sum

    - name: Install LXC + libvirt
      run: |
        sudo apt-get update
        sudo apt-get install -y lxc libvirt-daemon-system libvirt-daemon-driver-lxc libvirt-dev
        sudo systemctl start libvirtd
        sudo usermod -aG libvirt $USER

    - name: Verify vendor directory
      working-directory: src/bosh-libvirt-cpi
      run: |
        if [ ! -d "vendor" ]; then
          echo "Vendor directory not found. Running go mod vendor..."
          go mod vendor
        fi

    - name: Run integration tests (LXC)
      working-directory: src/bosh-libvirt-cpi
      env:
        LIBVIRT_URI: lxc:///
      # sudo-rs (Ubuntu 26.04) ignores -E: pass LIBVIRT_URI explicitly, and
      # REQUIRE_LIBVIRT so a missing/unreachable libvirt fails instead of skipping.
      run: sudo env LIBVIRT_URI="${LIBVIRT_URI}" REQUIRE_LIBVIRT=1 "$(which go)" test -tags integration -mod=vendor ./...

    - name: Generate coverage
      working-directory: src/bosh-libvirt-cpi
      run: sudo "$(which go)" test -coverprofile=coverage.out -mod=vendor ./...

    - name: Upload coverage
      uses: codecov/codecov-action@v7
      with:
        files: src/bosh-libvirt-cpi/coverage.out
        flags: integration-lxc

  code-quality:
    name: Code Quality
    runs-on: ubuntu-latest
    needs: unit-tests

    steps:
    - uses: actions/checkout@v7

    - name: Set up Go
      uses: actions/setup-go@v7
      with:
        go-version-file: src/bosh-libvirt-cpi/go.mod
        cache-dependency-path: src/bosh-libvirt-cpi/go.sum

    - name: Install libvirt dev headers
      run: sudo apt-get update && sudo apt-get install -y libvirt-dev

    - name: Run vet
      working-directory: src/bosh-libvirt-cpi
      run: go vet -mod=vendor ./...

    - name: Check format
      working-directory: src/bosh-libvirt-cpi
      run: |
        files=$(gofmt -l $(find . -name '*.go' -not -path './vendor/*'))
        if [ -n "$files" ]; then
          echo "Code formatting issues found:"
          echo "$files"
          exit 1
        fi

    - name: Run golangci-lint
      uses: golangci/golangci-lint-action@v9
      with:
        working-directory: src/bosh-libvirt-cpi
        version: latest
        args: --timeout=5m

  security-scan:
    name: Security Scan
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v7

    - name: Install libvirt dev headers
      run: sudo apt-get update && sudo apt-get install -y libvirt-dev

    - name: Run Gosec Security Scanner
      uses: securego/gosec@master
      with:
        args: '-no-fail -fmt sarif -out gosec-results.sarif ./src/bosh-libvirt-cpi/...'

    - name: Upload Gosec results
      uses: github/codeql-action/upload-sarif@v4
      if: always()
      with:
        sarif_file: gosec-results.sarif
