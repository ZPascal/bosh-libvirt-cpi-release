name: Tests and Build

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  unit-tests:
    name: Unit Tests
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v7

    - name: Set up Go
      uses: actions/setup-go@v7
      with:
        go-version-file: src/bosh-libvirt-cpi/go.mod
        cache-dependency-path: src/bosh-libvirt-cpi/go.sum

    - name: Install libvirt dev headers
      run: sudo apt-get update && sudo apt-get install -y libvirt-dev

    - name: Verify vendor directory
      working-directory: src/bosh-libvirt-cpi
      run: |
        if [ ! -d "vendor" ]; then
          echo "Vendor directory not found. Running go mod vendor..."
          go mod vendor
        fi

    - name: Run unit tests
      working-directory: src/bosh-libvirt-cpi
      run: make test

    - name: Upload coverage reports
      uses: codecov/codecov-action@v7
      with:
        files: src/bosh-libvirt-cpi/coverage.out
        flags: unittests

  build:
    name: Build Binary
    runs-on: ubuntu-latest
    needs: unit-tests

    steps:
    - uses: actions/checkout@v7

    - name: Set up Go
      uses: actions/setup-go@v7
      with:
        go-version-file: src/bosh-libvirt-cpi/go.mod
        cache-dependency-path: src/bosh-libvirt-cpi/go.sum

    - name: Install libvirt dev headers
      run: sudo apt-get update && sudo apt-get install -y libvirt-dev

    - name: Build binary
      working-directory: src/bosh-libvirt-cpi
      run: make build

    - name: Upload binary
      uses: actions/upload-artifact@v7
      with:
        name: cpi-binary
        path: src/bosh-libvirt-cpi/bin/cpi

  integration-tests-qemu:
    name: Integration Tests (QEMU)
    runs-on: ubuntu-latest
    needs: build

    steps:
    - uses: actions/checkout@v7

    - name: Set up Go
      uses: actions/setup-go@v7
      with:
        go-version-file: src/bosh-libvirt-cpi/go.mod
        cache-dependency-path: src/bosh-libvirt-cpi/go.sum

    - name: Install QEMU + libvirt
      run: |
        sudo apt-get update
        sudo apt-get install -y qemu-kvm libvirt-daemon-system libvirt-clients virtinst libvirt-dev
        sudo systemctl start libvirtd
        sudo usermod -aG libvirt $USER

    - name: Verify vendor directory
      working-directory: src/bosh-libvirt-cpi
      run: |
        if [ ! -d "vendor" ]; then
          echo "Vendor directory not found. Running go mod vendor..."
          go mod vendor
        fi

    - name: Run integration tests (QEMU)
      working-directory: src/bosh-libvirt-cpi
      env:
        LIBVIRT_URI: qemu:///system
      run: sudo -E go test -tags integration -mod=vendor ./...

    - name: Generate coverage
      working-directory: src/bosh-libvirt-cpi
      run: sudo -E go test -coverprofile=coverage.out -mod=vendor ./...

    - name: Upload coverage
      uses: codecov/codecov-action@v7
      with:
        files: src/bosh-libvirt-cpi/coverage.out
        flags: integration-qemu

    - name: Install BOSH CLI
      run: |
        curl -fsSL https://github.com/cloudfoundry/bosh-cli/releases/download/v7.10.8/bosh-cli-7.10.8-linux-amd64 \
          -o /usr/local/bin/bosh
        chmod +x /usr/local/bin/bosh
        bosh --version

    - name: Download BOSH stemcell
      run: |
        curl -fsSL https://bosh.io/d/stemcells/bosh-warden-boshlite-ubuntu-jammy-go_agent \
          -o /tmp/bosh-stemcell.tgz

    - name: Bootstrap BOSH Director via QEMU (bosh-lite)
      run: |
        INTERNAL_IP=$(hostname -I | awk '{print $1}')
        sudo bosh create-env manifests/qemu-cpi.yml \
          -o manifests/ops/qemu-local.yml \
          -o manifests/ops/local-release-dir.yml \
          -v director_name=bosh-qemu-ci \
          -v internal_ip="${INTERNAL_IP}" \
          -v stemcell_url=/tmp/bosh-stemcell.tgz \
          -v release_dir="${GITHUB_WORKSPACE}" \
          --state /tmp/bosh-state.json \
          --vars-store /tmp/bosh-vars.yml

    - name: Configure BOSH alias (QEMU)
      run: |
        INTERNAL_IP=$(hostname -I | awk '{print $1}')
        bosh alias-env qemu-ci \
          -e "${INTERNAL_IP}" \
          --ca-cert <(bosh int /tmp/bosh-vars.yml --path /director_ssl/ca)

    - name: Deploy smoke test deployment (QEMU)
      run: |
        bosh -e qemu-ci -d qemu-test-deployment deploy manifests/qemu-deployment.yml \
          -n \
          --fix

    - name: Clean up Director (QEMU)
      if: always()
      run: |
        sudo bosh delete-env manifests/qemu-cpi.yml \
          -o manifests/ops/qemu-local.yml \
          -o manifests/ops/local-release-dir.yml \
          --state /tmp/bosh-state.json \
          --vars-store /tmp/bosh-vars.yml \
          -v director_name=bosh-qemu-ci \
          -v stemcell_url=/tmp/bosh-stemcell.tgz \
          -v release_dir="${GITHUB_WORKSPACE}" || true

  integration-tests-lxc:
    name: Integration Tests (LXC)
    runs-on: ubuntu-latest
    needs: build

    steps:
    - uses: actions/checkout@v7

    - name: Set up Go
      uses: actions/setup-go@v7
      with:
        go-version-file: src/bosh-libvirt-cpi/go.mod
        cache-dependency-path: src/bosh-libvirt-cpi/go.sum

    - name: Install LXC + libvirt
      run: |
        sudo apt-get update
        sudo apt-get install -y lxc libvirt-daemon-system libvirt-daemon-driver-lxc libvirt-dev
        sudo systemctl start libvirtd
        sudo usermod -aG libvirt $USER

    - name: Verify vendor directory
      working-directory: src/bosh-libvirt-cpi
      run: |
        if [ ! -d "vendor" ]; then
          echo "Vendor directory not found. Running go mod vendor..."
          go mod vendor
        fi

    - name: Run integration tests (LXC)
      working-directory: src/bosh-libvirt-cpi
      env:
        LIBVIRT_URI: lxc:///
      run: sudo -E go test -tags integration -mod=vendor ./...

    - name: Install BOSH CLI
      run: |
        curl -fsSL https://github.com/cloudfoundry/bosh-cli/releases/download/v7.10.8/bosh-cli-7.10.8-linux-amd64 \
          -o /usr/local/bin/bosh
        chmod +x /usr/local/bin/bosh
        bosh --version

    - name: Download BOSH stemcell
      run: |
        curl -fsSL https://bosh.io/d/stemcells/bosh-warden-boshlite-ubuntu-jammy-go_agent \
          -o /tmp/bosh-stemcell.tgz

    - name: Bootstrap BOSH Director via LXC (bosh-lite)
      run: |
        INTERNAL_IP=$(hostname -I | awk '{print $1}')
        sudo bosh create-env manifests/lxc-cpi.yml \
          -o manifests/ops/lxc-local.yml \
          -o manifests/ops/local-release-dir.yml \
          -v director_name=bosh-lxc-ci \
          -v internal_ip="${INTERNAL_IP}" \
          -v stemcell_url=/tmp/bosh-stemcell.tgz \
          -v release_dir="${GITHUB_WORKSPACE}" \
          --state /tmp/bosh-state.json \
          --vars-store /tmp/bosh-vars.yml

    - name: Configure BOSH alias (LXC)
      run: |
        INTERNAL_IP=$(hostname -I | awk '{print $1}')
        bosh alias-env lxc-ci \
          -e "${INTERNAL_IP}" \
          --ca-cert <(bosh int /tmp/bosh-vars.yml --path /director_ssl/ca)

    - name: Deploy smoke test deployment (LXC)
      run: |
        bosh -e lxc-ci -d lxc-test-deployment deploy manifests/lxc-deployment.yml \
          -n \
          --fix

    - name: Clean up Director (LXC)
      if: always()
      run: |
        sudo bosh delete-env manifests/lxc-cpi.yml \
          -o manifests/ops/lxc-local.yml \
          -o manifests/ops/local-release-dir.yml \
          --state /tmp/bosh-state.json \
          --vars-store /tmp/bosh-vars.yml \
          -v director_name=bosh-lxc-ci \
          -v stemcell_url=/tmp/bosh-stemcell.tgz \
          -v release_dir="${GITHUB_WORKSPACE}" || true

  code-quality:
    name: Code Quality
    runs-on: ubuntu-latest
    needs: unit-tests

    steps:
    - uses: actions/checkout@v7

    - name: Set up Go
      uses: actions/setup-go@v7
      with:
        go-version-file: src/bosh-libvirt-cpi/go.mod
        cache-dependency-path: src/bosh-libvirt-cpi/go.sum

    - name: Install libvirt dev headers
      run: sudo apt-get update && sudo apt-get install -y libvirt-dev

    - name: Run vet
      working-directory: src/bosh-libvirt-cpi
      run: go vet -mod=vendor ./...

    - name: Check format
      working-directory: src/bosh-libvirt-cpi
      run: |
        files=$(gofmt -l $(find . -name '*.go' -not -path './vendor/*'))
        if [ -n "$files" ]; then
          echo "Code formatting issues found:"
          echo "$files"
          exit 1
        fi

    - name: Run golangci-lint
      uses: golangci/golangci-lint-action@v9
      with:
        working-directory: src/bosh-libvirt-cpi
        version: latest
        args: --timeout=5m

  security-scan:
    name: Security Scan
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v7

    - name: Install libvirt dev headers
      run: sudo apt-get update && sudo apt-get install -y libvirt-dev

    - name: Run Gosec Security Scanner
      uses: securego/gosec@master
      with:
        args: '-no-fail -fmt sarif -out gosec-results.sarif ./src/bosh-libvirt-cpi/...'

    - name: Upload Gosec results
      uses: github/codeql-action/upload-sarif@v4
      if: always()
      with:
        sarif_file: gosec-results.sarif
