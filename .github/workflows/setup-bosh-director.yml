name: Setup BOSH Director

on:
  workflow_call:
    inputs:
      backend:
        description: 'Virtualization backend: qemu or lxc'
        required: true
        type: string
      bosh_cli_version:
        description: 'BOSH CLI version to install'
        required: false
        type: string
        default: v7.10.8
      cpi_repository:
        description: 'Repository that provides the CPI release, manifests and scripts'
        required: false
        type: string
        default: ZPascal/bosh-libvirt-cpi-release
      cpi_ref:
        description: 'Branch, tag or SHA of the CPI repository to build the release from'
        required: false
        type: string
        default: main
      cpi_version:
        description: 'CPI release tag (e.g. v1.2.3) or latest. The release binary is used unless the caller runs on pull_request, where the code is compiled from source. Empty = always compile.'
        required: false
        type: string
        default: latest
    outputs:
      director-url:
        description: 'BOSH Director API URL'
        value: ${{ jobs.setup.outputs.director-url }}
      director-ca-cert:
        description: 'Base64-encoded PEM CA certificate'
        value: ${{ jobs.setup.outputs.director-ca-cert }}
      bosh-client:
        description: 'BOSH client username'
        value: ${{ jobs.setup.outputs.bosh-client }}
      bosh-client-secret:
        description: 'BOSH client password (masked)'
        value: ${{ jobs.setup.outputs.bosh-client-secret }}
      bosh-env-alias:
        description: 'BOSH environment alias'
        value: ${{ jobs.setup.outputs.bosh-env-alias }}
      bosh-state-b64:
        description: 'Base64-encoded bosh-state.json (for teardown)'
        value: ${{ jobs.setup.outputs.bosh-state-b64 }}
      bosh-vars-b64:
        description: 'Base64-encoded bosh-vars.yml (for teardown)'
        value: ${{ jobs.setup.outputs.bosh-vars-b64 }}
      libvirt-private-key-b64:
        description: 'Base64-encoded libvirt SSH private key (for teardown)'
        value: ${{ jobs.setup.outputs.libvirt-private-key-b64 }}

jobs:
  setup:
    name: Setup BOSH Director (${{ inputs.backend }})
    runs-on: ubuntu-latest
    timeout-minutes: 240
    outputs:
      director-url:      ${{ steps.emit.outputs.director-url }}
      director-ca-cert:  ${{ steps.emit.outputs.director-ca-cert }}
      bosh-client:       ${{ steps.emit.outputs.bosh-client }}
      bosh-client-secret: ${{ steps.emit.outputs.bosh-client-secret }}
      bosh-env-alias:    ${{ steps.emit.outputs.bosh-env-alias }}
      bosh-state-b64:    ${{ steps.emit.outputs.bosh-state-b64 }}
      bosh-vars-b64:     ${{ steps.emit.outputs.bosh-vars-b64 }}
      libvirt-private-key-b64: ${{ steps.emit.outputs.libvirt-private-key-b64 }}

    steps:
    # Always check out the CPI repo (not the caller's), so the workflow can be
    # used from any repository via `uses: ZPascal/bosh-libvirt-cpi-release/...`.
    - uses: actions/checkout@v7
      with:
        repository: ${{ inputs.cpi_repository }}
        ref: ${{ inputs.cpi_ref }}

    - name: Set up BOSH Director
      uses: ./.github/actions/setup-bosh-director
      with:
        backend: ${{ inputs.backend }}
        bosh_cli_version: ${{ inputs.bosh_cli_version }}
        cpi_binary_version: ${{ inputs.cpi_version }}
        cpi_repository: ${{ inputs.cpi_repository }}

    - name: Emit director outputs
      id: emit
      shell: bash
      run: |
        set -euo pipefail
        echo "::add-mask::admin-password"
        CA_CERT_B64=$(bosh int /tmp/bosh-vars.yml --path /director_ssl/ca | base64 -w0)
        STATE_B64=$(base64 -w0 /tmp/bosh-state.json)
        VARS_B64=$(base64 -w0 /tmp/bosh-vars.yml)
        LIBVIRT_KEY_B64=$(base64 -w0 /tmp/bosh-libvirt-ssh-key)
        {
          echo "director-url=https://${DIRECTOR_IP}:25555"
          echo "director-ca-cert=${CA_CERT_B64}"
          echo "bosh-client=admin"
          echo "bosh-client-secret=admin-password"
          echo "bosh-env-alias=${BOSH_ENV_ALIAS}"
          echo "bosh-state-b64=${STATE_B64}"
          echo "bosh-vars-b64=${VARS_B64}"
          echo "libvirt-private-key-b64=${LIBVIRT_KEY_B64}"
        } >> "$GITHUB_OUTPUT"
