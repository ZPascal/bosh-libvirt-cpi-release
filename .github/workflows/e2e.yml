name: E2E bosh-lite

on:
  workflow_call:
    inputs:
      backend:
        description: 'Virtualization backend: qemu or lxc'
        required: true
        type: string
      bosh_cli_version:
        description: 'BOSH CLI version to install'
        required: false
        type: string
        default: v7.10.8

jobs:
  e2e:
    name: E2E Tests (${{ inputs.backend }})
    runs-on: ubuntu-latest
    timeout-minutes: 240

    steps:
    - uses: actions/checkout@v7

    - name: Set up BOSH Director
      uses: ./.github/actions/setup-bosh-director
      with:
        backend: ${{ inputs.backend }}
        bosh_cli_version: ${{ inputs.bosh_cli_version }}

    - name: Upload stemcell and release (QEMU)
      if: inputs.backend == 'qemu'
      shell: bash
      run: |
        timeout 120 bosh -e "${BOSH_ENV_ALIAS}" update-cloud-config manifests/cloud-config-qemu.yml \
          --client admin --client-secret admin-password \
          -v "kernel_path=${KERNEL_PATH}" \
          -n
        timeout 600 bosh -e "${BOSH_ENV_ALIAS}" upload-stemcell /tmp/bosh-stemcell.tgz \
          --client admin --client-secret admin-password || {
            bash .github/scripts/e2e-debug-${{ inputs.backend }}.sh upload || true
            exit 1
          }
        echo "Waiting for blobstore (port 25250)..."
        _blob_ok=0
        for _i in $(seq 1 80); do
          if nc -z "${DIRECTOR_IP}" 25250 2>/dev/null; then _blob_ok=1; break; fi
          sleep 3
        done
        if [ "$_blob_ok" != "1" ]; then
          echo "ERROR: blobstore port 25250 never opened after 240s"
          bash .github/scripts/e2e-debug-${{ inputs.backend }}.sh upload || true
          exit 1
        fi
        echo "Blobstore ready"
        echo "=== stemcell ext4 pre-deploy check ==="
        SC_IMG=$(sudo find /tmp/bosh_libvirt_cpi/stemcells -name 'image.ext4' 2>/dev/null | head -1)
        if [ -n "$SC_IMG" ]; then
          echo "Stemcell: $SC_IMG ($(sudo du -sh "$SC_IMG" 2>/dev/null | cut -f1))"
          sudo file "$SC_IMG" 2>/dev/null || true
          sudo tune2fs -l "$SC_IMG" 2>/dev/null | grep -E 'Block count|Inode count|Free blocks|Free inodes|Filesystem state' || echo "(tune2fs failed)"
        else
          echo "WARNING: no stemcell image.ext4 found before deploy"
        fi
        timeout 300 bosh -e "${BOSH_ENV_ALIAS}" upload-release \
          https://bosh.io/d/github.com/cloudfoundry/bosh?v=283.1.3 \
          --sha1 91a350d377e9185fbc950a1168073eb1e3207eae \
          --client admin --client-secret admin-password

    - name: Upload stemcell and release (LXC)
      if: inputs.backend == 'lxc'
      shell: bash
      run: |
        timeout 120 bosh -e "${BOSH_ENV_ALIAS}" update-cloud-config manifests/cloud-config-lxc.yml \
          --client admin --client-secret admin-password \
          -n
        timeout 600 bosh -e "${BOSH_ENV_ALIAS}" upload-stemcell /tmp/bosh-stemcell.tgz \
          --client admin --client-secret admin-password || {
            bash .github/scripts/e2e-debug-${{ inputs.backend }}.sh upload || true
            exit 1
          }
        echo "Waiting for blobstore (port 25250)..."
        _blob_ok=0
        for _i in $(seq 1 80); do
          if nc -z "${DIRECTOR_IP}" 25250 2>/dev/null; then _blob_ok=1; break; fi
          sleep 3
        done
        if [ "$_blob_ok" != "1" ]; then
          echo "ERROR: blobstore port 25250 never opened after 240s"
          bash .github/scripts/e2e-debug-${{ inputs.backend }}.sh upload || true
          exit 1
        fi
        echo "Blobstore ready"
        timeout 300 bosh -e "${BOSH_ENV_ALIAS}" upload-release \
          https://bosh.io/d/github.com/cloudfoundry/bosh?v=283.1.3 \
          --sha1 91a350d377e9185fbc950a1168073eb1e3207eae \
          --client admin --client-secret admin-password

    - name: Deploy smoke test
      shell: bash
      run: |
        SB_WATCH_PID=""
        if [ "${{ inputs.backend }}" = "qemu" ]; then
          ( known=""; while true; do
              for img in $(sudo find "${STORE_DIR}/vms" -name 'rootfs.img' 2>/dev/null); do
                if ! echo "$known" | grep -qF "$img"; then
                  known="$known $img"
                  sz=$(sudo du -sh "$img" 2>/dev/null | cut -f1)
                  val=$(sudo python3 -c "import struct; f=open('$img','rb'); f.seek(1120); v=struct.unpack('<I',f.read(4))[0]; f.close(); print('0x{:08x} nr={}'.format(v,(v>>2)&1))" 2>/dev/null || echo "read_err")
                  echo "[sb-watch] new rootfs.img: $img ($sz) incompat=$val" | sudo tee -a /tmp/sb-watch.log
                fi
              done
              sleep 5
            done ) &
          SB_WATCH_PID=$!
        fi
        DEPLOY_RC=0
        timeout 3600 bosh -e "${BOSH_ENV_ALIAS}" -d "${DEPLOYMENT_NAME}" deploy manifests/test-deployment.yml \
          --client admin --client-secret admin-password \
          --vars-store /tmp/bosh-deploy-vars.yml \
          -v deployment_name="${DEPLOYMENT_NAME}" \
          -v director_address="${DIRECTOR_IP}" \
          -n --fix || DEPLOY_RC=$?
        if [ -n "$SB_WATCH_PID" ]; then
          kill "$SB_WATCH_PID" 2>/dev/null || true
          echo "=== sb-watch log ===" && cat /tmp/sb-watch.log 2>/dev/null || true
          echo "=== final superblock state of all VM rootfs.img files ==="
          sudo find "${STORE_DIR}/vms" -name 'rootfs.img' 2>/dev/null | while read -r img; do
            sz=$(sudo du -sh "$img" 2>/dev/null | cut -f1)
            val=$(sudo python3 -c "import struct; f=open('$img','rb'); f.seek(1120); v=struct.unpack('<I',f.read(4))[0]; f.close(); print('incompat=0x{:08x} nr={}'.format(v,(v>>2)&1))" 2>/dev/null || echo "read_err")
            echo "[final-sb] $img ($sz) $val"
          done || true
        fi
        if [ $DEPLOY_RC -ne 0 ]; then
          bash .github/scripts/e2e-debug-${{ inputs.backend }}.sh deploy || true
          exit 1
        fi

    - name: Verify smoke test deployment
      shell: bash
      run: |
        echo "=== Checking NATS port 4222 on 192.168.122.20 ==="
        timeout 240 bash -c 'until nc -z 192.168.122.20 4222; do echo "waiting for nats..."; sleep 5; done' || {
          bash .github/scripts/e2e-debug-${{ inputs.backend }}.sh verify || true
          exit 1
        }
        echo "NATS port 4222 reachable - deployment verified"
        bosh -e "${BOSH_ENV_ALIAS}" deployments --client admin --client-secret admin-password --json | \
          python3 -c "import sys,json; d=json.load(sys.stdin); rows=d.get('Tables',[{}])[0].get('Rows',[]); print('Deployments found:',len(rows)); [print(' -',r.get('name')) for r in rows]"
        bosh -e "${BOSH_ENV_ALIAS}" -d "${DEPLOYMENT_NAME}" vms --client admin --client-secret admin-password
        bosh -e "${BOSH_ENV_ALIAS}" vms --client admin --client-secret admin-password
        nc -zv "${DIRECTOR_IP}" 5432 2>&1 && echo "DB port reachable" || echo "WARNING: DB port 5432 not reachable from CI host"
        echo "=== DB network connectivity: director postgres self-check (via SSH) ==="
        ssh -i "${SSH_KEY}" -o StrictHostKeyChecking=no -o ConnectTimeout=10 \
          root@"${DIRECTOR_IP}" 'nc -zv 127.0.0.1 5432 2>&1 && echo "DB local ok" || echo "DB not listening locally"' 2>/dev/null || echo "(SSH unavailable)"
        echo "=== All ${{ inputs.backend }} e2e checks passed ==="

    - name: Clean up Director (QEMU)
      if: always() && inputs.backend == 'qemu'
      run: |
        sudo bosh delete-env manifests/qemu-cpi.yml \
          -o manifests/ops/qemu-local.yml \
          -o manifests/local-release.yml \
          -o manifests/ops/local-store-dir.yml \
          -o manifests/ops/qemu-mac.yml \
          -o manifests/ops/qemu-kernel-boot.yml \
          -o manifests/ops/qemu-director-ssh.yml \
          --state /tmp/bosh-state.json \
          --vars-store /tmp/bosh-vars.yml \
          -v director_name="${DIRECTOR_NAME}" \
          -v internal_ip="${DIRECTOR_IP}" \
          -v stemcell_url=file:///tmp/bosh-stemcell.tgz \
          -v "kernel_path=${KERNEL_PATH}" \
          -v libvirt_host=192.168.122.1 \
          -v libvirt_username=root \
          --var-file libvirt_private_key=/tmp/bosh-libvirt-ssh-key \
          -v "libvirt_host_key=${LIBVIRT_HOST_KEY}" || true

    - name: Clean up Director (LXC)
      if: always() && inputs.backend == 'lxc'
      run: |
        sudo bosh delete-env manifests/lxc-cpi.yml \
          -o manifests/ops/lxc-local.yml \
          -o manifests/local-release.yml \
          -o manifests/ops/local-store-dir.yml \
          -o manifests/ops/lxc-mac.yml \
          -o manifests/ops/lxc-director-ssh.yml \
          --state /tmp/bosh-state.json \
          --vars-store /tmp/bosh-vars.yml \
          -v director_name="${DIRECTOR_NAME}" \
          -v internal_ip="${DIRECTOR_IP}" \
          -v stemcell_url=file:///tmp/bosh-stemcell.tgz \
          -v libvirt_host=192.168.122.1 \
          -v libvirt_username=root \
          --var-file libvirt_private_key=/tmp/bosh-libvirt-ssh-key \
          -v "libvirt_host_key=${LIBVIRT_HOST_KEY}" || true
