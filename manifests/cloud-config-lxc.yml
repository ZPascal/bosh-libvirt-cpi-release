---
azs:
- name: z1
  cloud_properties: {}

vm_types:
- name: default
  cloud_properties:
    memory: 1024
    cpus: 1
    ephemeral_disk: 10240

disk_types:
- name: default
  disk_size: 5120
  cloud_properties: {}

networks:
- name: default
  type: manual
  subnets:
  - range: 192.168.122.0/24
    gateway: 192.168.122.1
    dns: [8.8.8.8]
    az: z1
    static: [192.168.122.20]
    reserved: [192.168.122.0, 192.168.122.1, 192.168.122.2-192.168.122.19, 192.168.122.30-192.168.122.254]
    cloud_properties: {}

compilation:
  workers: 1
  reuse_compilation_vms: true
  az: z1
  vm_type: default
  network: default
