---
# Replaces the manual network with a dynamic network for local CI use
# where the runner IP is DHCP-assigned and outside the hardcoded subnet.
- type: replace
  path: /networks/name=default/type
  value: dynamic
- type: remove
  path: /networks/name=default/subnets/0/range?
- type: remove
  path: /networks/name=default/subnets/0/gateway?
- type: remove
  path: /networks/name=default/subnets/0/dns?
- type: remove
  path: /networks/name=default/subnets/0/static?
- type: replace
  path: /networks/name=default/subnets/0
  value:
    cloud_properties: {}
- type: replace
  path: /instance_groups/name=bosh/networks/0/static_ips?
  value: ~
