---
# SSH credentials remain in both cloud_provider and instance_groups so
# both the bootstrap CPI (running on this host via SSH tunnel to 192.168.122.1)
# and the deployed director's CPI can reach libvirtd.
# Restores the libvirt default NAT network (192.168.122.0/24)
# so the QEMU Director VM gets a reachable IP.
- type: replace
  path: /networks/name=default/type
  value: manual
- type: replace
  path: /networks/name=default/subnets
  value:
  - range: 192.168.122.0/24
    gateway: 192.168.122.1
    dns: [192.168.122.1, 8.8.8.8]
    static: [192.168.122.10]
    cloud_properties: {}
- type: replace
  path: /instance_groups/name=bosh/networks/0/static_ips
  value: [192.168.122.10]
