---
# Switches the QEMU CPI to direct kernel boot mode (ext4 raw rootfs on /dev/vda).
# Requires the host kernel path to be set via cloud_properties.kernel per VM,
# and changes the backend URI to qemu:///system?kernel=1 so the CPI selects
# QEMUKernelDomainBuilder which builds the stemcell as an ext4 disk image.
- type: replace
  path: /instance_groups/name=bosh/properties/libvirt_cpi/backend_uri
  value: qemu:///system?kernel=1
- type: replace
  path: /cloud_provider/properties/backend_uri
  value: qemu:///system?kernel=1
