---
# Minimal BOSH manifest for deploying the libvirt CPI against a QEMU/KVM host.
# Usage:
#   bosh create-env manifests/qemu-cpi.yml \
#     -v libvirt_host=<host-ip> \
#     -v libvirt_username=<ssh-user> \
#     --var-file libvirt_private_key=<path-to-key.pem> \
#     -v libvirt_host_key="ssh-ed25519 AAAA..." \
#     -v director_name=bosh-qemu \
#     -v internal_ip=<director-ip> \
#     -v stemcell_url=<path-or-url-to-stemcell>

name: bosh-qemu

releases:
- name: bosh
  url: https://bosh.io/d/github.com/cloudfoundry/bosh?v=283.1.3
  version: "283.1.3"
  sha1: 91a350d377e9185fbc950a1168073eb1e3207eae
- name: bosh-libvirt-cpi
  url: file://..
  version: create

resource_pools:
- name: vms
  network: default
  stemcell:
    url: ((stemcell_url))
  cloud_properties:
    memory: 2048
    cpus: 2
    ephemeral_disk: 25000

disk_pools:
- name: disks
  disk_size: 20000

networks:
- name: default
  type: manual
  subnets:
  - range: 192.168.1.0/24
    gateway: 192.168.1.1
    dns: [8.8.8.8]
    static: [192.168.1.6]

instance_groups:
- name: bosh
  instances: 1
  jobs:
  - name: nats
    release: bosh
  - name: postgres
    release: bosh
  - name: blobstore
    release: bosh
  - name: director
    release: bosh
  - name: health_monitor
    release: bosh
  - name: libvirt_cpi
    release: bosh-libvirt-cpi
  resource_pool: vms
  disk_pool: disks
  networks:
  - name: default
    static_ips: [((internal_ip))]
  properties:
    nats:
      address: 127.0.0.1
      user: nats
      password: nats-password
      tls:
        ca: ((nats_ca.ca))
        client_ca:
          certificate: ((nats_ca.certificate))
          private_key: ((nats_ca.private_key))
        server:
          certificate: ((nats_server_tls.certificate))
          private_key: ((nats_server_tls.private_key))
        director:
          certificate: ((nats_clients_director_tls.certificate))
          private_key: ((nats_clients_director_tls.private_key))
        health_monitor:
          certificate: ((nats_clients_hm_tls.certificate))
          private_key: ((nats_clients_hm_tls.private_key))
    postgres: &db
      listen_address: 127.0.0.1
      host: 127.0.0.1
      user: postgres
      password: postgres-password
      database: bosh
      adapter: postgres
    blobstore:
      address: ((internal_ip))
      port: 25250
      provider: dav
      director:
        user: director
        password: director-password
      agent:
        user: agent
        password: agent-password
      tls:
        cert:
          ca: ((blobstore_server_tls.ca))
          certificate: ((blobstore_server_tls.certificate))
          private_key: ((blobstore_server_tls.private_key))
    director:
      address: 127.0.0.1
      name: ((director_name))
      cpi_job: libvirt_cpi
      max_threads: 3
      db: *db
      backend_port: 25556
      ssl:
        cert: ((director_ssl.certificate))
        key: ((director_ssl.private_key))
    hm:
      director_account:
        user: admin
        password: admin-password
        ca_cert: ((director_ssl.ca))
      resurrector_enabled: true
    agent:
      mbus: nats://nats:nats-password@((internal_ip)):4222
    libvirt_cpi:
      backend_uri: qemu:///system
      host: ((libvirt_host))
      username: ((libvirt_username))
      private_key: ((libvirt_private_key))
      host_key: ((libvirt_host_key))
      store_dir: ~/.bosh_libvirt_cpi

cloud_provider:
  template:
    name: libvirt_cpi
    release: bosh-libvirt-cpi
  mbus: https://mbus:mbus-password@((internal_ip)):6868
  properties:
    backend_uri: qemu:///system
    host: ((libvirt_host))
    username: ((libvirt_username))
    private_key: ((libvirt_private_key))
    host_key: ((libvirt_host_key))
    store_dir: ~/.bosh_libvirt_cpi
    agent:
      mbus: https://mbus:mbus-password@0.0.0.0:6868
      blobstore:
        provider: local
        options:
          blobstore_path: /var/vcap/micro_bosh/data/cache
      env:
        bosh:
          mbus:
            cert: ((mbus_bootstrap_ssl))
    ntp: [0.pool.ntp.org, 1.pool.ntp.org]

variables:
- name: default_ca
  type: certificate
  options:
    is_ca: true
    common_name: ca
- name: mbus_bootstrap_ssl
  type: certificate
  options:
    ca: default_ca
    common_name: ((internal_ip))
    alternative_names: [((internal_ip))]
- name: director_ssl
  type: certificate
  options:
    ca: default_ca
    common_name: ((internal_ip))
    alternative_names: [((internal_ip))]
- name: nats_ca
  type: certificate
  options:
    is_ca: true
    common_name: default.nats-ca.bosh-internal
- name: nats_server_tls
  type: certificate
  options:
    ca: nats_ca
    common_name: default.nats.bosh-internal
    alternative_names: [((internal_ip))]
    extended_key_usage: [server_auth]
- name: nats_clients_director_tls
  type: certificate
  options:
    ca: nats_ca
    common_name: default.director.bosh-internal
    extended_key_usage: [client_auth]
- name: nats_clients_hm_tls
  type: certificate
  options:
    ca: nats_ca
    common_name: default.hm.bosh-internal
    extended_key_usage: [client_auth]
- name: blobstore_ca
  type: certificate
  options:
    is_ca: true
    common_name: default.blobstore-ca.bosh-internal
- name: blobstore_server_tls
  type: certificate
  options:
    ca: blobstore_ca
    common_name: ((internal_ip))
    alternative_names: [((internal_ip))]
