---
# Minimal single-instance deployment for QEMU/KVM integration smoke test.
# Deploys a nats instance using the already-compiled bosh release to verify
# the Director can manage QEMU VMs (VM create, disk attach, network, agent bootstrap).
name: qemu-test-deployment

releases:
- name: bosh
  version: latest

stemcells:
- alias: default
  os: ubuntu-jammy
  version: latest

update:
  canaries: 1
  max_in_flight: 1
  canary_watch_time: 30000-300000
  update_watch_time: 30000-300000

instance_groups:
- name: nats
  instances: 1
  azs: [z1]
  jobs:
  - name: nats
    release: bosh
    properties:
      nats:
        user: nats
        password: nats-password
        address: 0.0.0.0
        port: 4222
        tls:
          ca: ((nats_ca.ca))
          client_ca:
            certificate: ((nats_ca.ca))
            private_key: ((nats_ca.private_key))
          server:
            certificate: ((nats_server_certificate.certificate))
            private_key: ((nats_server_certificate.private_key))
          director:
            certificate: ((nats_clients_director.certificate))
            private_key: ((nats_clients_director.private_key))
          health_monitor:
            certificate: ((nats_clients_hm.certificate))
            private_key: ((nats_clients_hm.private_key))
  vm_type: default
  stemcell: default
  networks:
  - name: default
    static_ips: [192.168.122.20]

variables:
- name: nats_ca
  type: certificate
  options:
    is_ca: true
    common_name: natsCA
- name: nats_server_certificate
  type: certificate
  options:
    ca: nats_ca
    common_name: nats
    alternative_names: [192.168.122.20]
- name: nats_clients_director
  type: certificate
  options:
    ca: nats_ca
    common_name: director
    extended_key_usage: [client_auth]
- name: nats_clients_hm
  type: certificate
  options:
    ca: nats_ca
    common_name: hm
    extended_key_usage: [client_auth]
